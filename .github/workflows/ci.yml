name: Checks
on:
  push:
    branches: [main, codex/program-management-p1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax and unit / API tests
        run: npm run check
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose without secrets
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build tested non-root runtime
        run: docker build --target runtime --tag cost-reduction-programs:check .
      - name: Smoke test isolated image without network or secrets
        run: sh scripts/docker-smoke.sh cost-reduction-programs:check
